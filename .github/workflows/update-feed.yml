name: Update Google Merchant Feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Google Merchant Feed
        run: python feed_generator.py

      - name: Commit Updated Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/google-products.xml
          git add local-inventory.xml

          git diff --cached --quiet || (
            git commit -m "Auto update Google Merchant Feed"
            git push
          )
